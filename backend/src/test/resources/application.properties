# Test Application Configuration - In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:mediguide_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Test JWT configuration (deterministic 256-bit secret)
jwt.secret=test-secret-key-at-least-32-bytes-long-for-hs256-signing-1234567890
jwt.expiration-minutes=15

# Test AI configuration
ai.provider.api-key=test-ai-key
ai.provider.base-url=https://api.openai.com/v1
ai.provider.model=gpt-4o-mini
ai.provider.connect-timeout-seconds=2
ai.provider.read-timeout-seconds=5
ai.summary.max-input-chars=6000

