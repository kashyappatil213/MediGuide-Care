# MediGuide Care - Application Configuration

# Application Metadata
spring.application.name=mediguide-care
server.port=8080

# PostgreSQL Database Configuration
# Credentials are read from environment variables to prevent hardcoding secrets.
# Defaults are provided for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediguide_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:mediguide-development-super-secure-jwt-secret-key-32chars-min-2026}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# AI Clinical History Summarizer Configuration
ai.provider.api-key=${AI_API_KEY:demo-clinical-key}
ai.provider.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.provider.model=${AI_MODEL:gpt-4o-mini}
ai.provider.connect-timeout-seconds=${AI_CONNECT_TIMEOUT_SECONDS:5}
ai.provider.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:15}
ai.summary.max-input-chars=${AI_MAX_INPUT_CHARS:6000}

# Email & SMTP Configuration
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:no-reply@mediguide.local}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.verification-cooldown-seconds=${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}
app.mail.verification-token-expiry-hours=${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

# CORS Configuration (Optional comma-separated additional origins beyond RFC 1918 LAN defaults)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

