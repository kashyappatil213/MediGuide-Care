# MediGuide Care - Application Configuration

# Application Metadata
spring.application.name=mediguide-care
server.port=8080

# PostgreSQL Database Configuration
# Credentials are read from environment variables to prevent hardcoding secrets.
# Defaults are provided for URL and username, while password must be provided via DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediguide_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Authentication Configuration
# JWT_SECRET must be supplied via environment variable (minimum 256 bits / 32 characters)
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# AI Clinical History Summarizer Configuration
ai.provider.api-key=${AI_API_KEY:}
ai.provider.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.provider.model=${AI_MODEL:gpt-4o-mini}
ai.provider.connect-timeout-seconds=${AI_CONNECT_TIMEOUT_SECONDS:5}
ai.provider.read-timeout-seconds=${AI_READ_TIMEOUT_SECONDS:15}
ai.summary.max-input-chars=${AI_MAX_INPUT_CHARS:6000}

