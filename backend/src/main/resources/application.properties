# MediGuide Care - Application Configuration

# Application Metadata
spring.application.name=mediguide-care
server.port=8080

# PostgreSQL Database Configuration
# Credentials are read from environment variables to prevent hardcoding secrets.
# Defaults are provided for URL and username, while password must be provided via DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediguide_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
